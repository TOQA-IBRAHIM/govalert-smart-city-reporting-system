<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Dashboard - Gov Alert</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #F2FBFC; 
      --primary-color: #318CE7;
      --resolved-color: #4CAF50;
      --in-progress-color: #FFA726;
      --text-color: #000;
      --card-bg: white;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Roboto', Arial, sans-serif;
      color: var(--text-color);
      direction: ltr;
      text-align: left;
      transition: direction 0.3s ease;
    }

    h1.dashboard-title {
      text-align: center;
      font-size: 28px;
      font-weight: 600;
      margin: 30px 0 20px;
      text-shadow: 1px 1px 2px #ccc;
      border-bottom: 2px solid var(--text-color);
      padding-bottom: 10px;
      width: fit-content;
      margin-inline: auto;
    }

    .report-list {
      max-width: 700px;
      margin: auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
      padding: 20px;
    }

    .report-card {
      background-color: var(--card-bg);
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      transition: transform 0.2s ease;
    }

    .report-card:hover {
      transform: translateY(-4px);
    }

    .report-card h3 {
      margin-bottom: 10px;
      font-size: 20px;
    }

    .report-card p {
      margin-bottom: 15px;
      font-size: 14px;
    }

    .status-badge {
      display: inline-block;
      padding: 4px 10px;
      font-size: 12px;
      font-weight: bold;
      border-radius: 4px;
      color: white;
      margin-top: 5px;
    }

    .status-resolved {
      background-color: var(--resolved-color);
    }

    .status-in-progress {
      background-color: var(--in-progress-color);
    }

    .chat-btn {
      display: inline-block;
      margin-top: 10px;
      padding: 8px 14px;
      background-color: var(--primary-color);
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-size: 14px;
      transition: background 0.3s ease;
    }

    .chat-btn:hover {
      background-color: #267bc9;
    }

    /* Footer */
    footer.nav-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      background-color: #fff;
      padding: 15px 20px;
      text-align: center;
      box-shadow: 0 -1px 6px rgba(0, 0, 0, 0.1);
      font-size: 14px;
    }

    footer a {
      color: var(--primary-color);
      text-decoration: none;
      margin: 0 15px;
      font-weight: 500;
    }

    footer a:hover {
      text-decoration: underline;
    }

    /* RTL Styles */
    [dir="rtl"] body {
      text-align: right;
    }

    [dir="rtl"] .chat-btn {
      margin-right: 10px;
      margin-left: 0;
    }
  </style>
</head>
<body dir="ltr">

  <h1 class="dashboard-title" id="dashboardTitle">My Reports</h1>

  <div id="reportsContainer" class="report-list">
    <div class="report-card">
      <h3 id="report1Title">Streetlight Not Working</h3>
      <p><span id="statusLabel1">Status:</span> <span class="status-badge status-resolved" id="status1">Resolved</span></p>
      <a href="chat.html?reportId=1" class="chat-btn" id="chatBtn1">💬 Open Chat</a>
    </div>

    <div class="report-card">
      <h3 id="report2Title">Water Leakage</h3>
      <p><span id="statusLabel2">Status:</span> <span class="status-badge status-in-progress" id="status2">In Progress</span></p>
      <a href="chat.html?reportId=2" class="chat-btn" id="chatBtn2">💬 Open Chat</a>
    </div>
  </div>

  <!-- Footer -->
  <footer class="nav-footer">
    <a href="dashboard.html" id="footerReports">📄 My Reports</a>
    <a href="report-form.html" id="footerAdd">➕ Add Report</a>
    <a href="profile.html" id="footerProfile">👤 My Profile</a>
  </footer>

  <script>
    let isArabic = localStorage.getItem('isArabic') === 'true';

    function applyLang() {
      document.documentElement.dir = isArabic ? "rtl" : "ltr";

      document.getElementById("dashboardTitle").textContent = isArabic ? "تقاريري" : "My Reports";
      document.getElementById("report1Title").textContent = isArabic ? "مصدر ضوء الشارع لا يعمل" : "Streetlight Not Working";
      document.getElementById("report2Title").textContent = isArabic ? "تسرب مائي" : "Water Leakage";
      document.getElementById("statusLabel1").textContent = isArabic ? "الحالة:" : "Status:";
      document.getElementById("statusLabel2").textContent = isArabic ? "الحالة:" : "Status:";
      document.getElementById("status1").textContent = isArabic ? "تم الحل" : "Resolved";
      document.getElementById("status2").textContent = isArabic ? "جارٍ العمل" : "In Progress";
      document.getElementById("chatBtn1").textContent = isArabic ? "💬 افتح المحادثة" : "💬 Open Chat";
      document.getElementById("chatBtn2").textContent = isArabic ? "💬 افتح المحادثة" : "💬 Open Chat";
      document.getElementById("footerReports").innerHTML = isArabic ? "📄 تقاريري" : "📄 My Reports";
      document.getElementById("footerAdd").innerHTML = isArabic ? "➕ إضافة تقرير" : "➕ Add Report";
      document.getElementById("footerProfile").innerHTML = isArabic ? "👤 ملفي الشخصي" : "👤 My Profile";
    }

    // Apply language settings on page load
    applyLang();
  </script>
</body>
</html>
