<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Forgot Password - Gov Alert</title>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg-color: #F2FBFC; 
      --primary-color: #318CE7;
      --text-color: #000;
      --input-border: #ccc;
      --card-bg: white;
      --shadow: rgba(0, 0, 0, 0.1);
    }

    * {
      box-sizing: border-box;
    }

    body {
      background-color: var(--bg-color);
      font-family: 'Roboto', Arial, sans-serif;
      margin: 0;
      padding: 0;
      direction: ltr;
      transition: direction 0.3s ease;
    }

    .container {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      max-width: 400px;
      margin-bottom: 20px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .logo img {
      height: 30px;
    }

    .logo h1 {
      margin: 0;
      font-size: 20px;
      color: var(--text-color);
    }

    .language-toggle {
      background: none;
      border: none;
      font-size: 24px;
      cursor: pointer;
      color: var(--text-color);
    }

    .forgot-password-container {
      background: var(--card-bg);
      padding: 40px;
      border-radius: 12px;
      box-shadow: 0 6px 20px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .step-indicator {
      font-size: 14px;
      color: #666;
      margin-bottom: 20px;
    }

    .forgot-password-container h2 {
      margin-bottom: 20px;
      color: var(--text-color);
      font-size: 24px;
      font-weight: 600;
    }

    input[type="email"] {
      width: 100%;
      padding: 12px;
      margin: 10px 0;
      border: 1px solid var(--input-border);
      border-radius: 6px;
      font-size: 14px;
      color: var(--text-color);
    }

    input[type="email"]::placeholder {
      color: #888;
    }

    button.submit-btn {
      width: 100%;
      padding: 12px;
      background-color: var(--primary-color);
      color: white;
      border: none;
      border-radius: 6px;
      font-size: 16px;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.3s ease;
    }

    button.submit-btn:hover {
      background-color: #267bc9;
    }

    .success-message {
      display: none;
      margin-top: 20px;
      color: green;
      font-size: 14px;
    }

    .back-text {
      margin-top: 20px;
      font-size: 14px;
      color: #666;
    }

    .back-text a {
      color: var(--text-color);
      text-decoration: none;
      font-weight: 500;
    }

    .back-text a:hover {
      text-decoration: underline;
    }

    /* RTL Styles */
    [dir="rtl"] body {
      text-align: right;
    }

    [dir="rtl"] .header {
      flex-direction: row-reverse;
    }

    [dir="rtl"] .logo {
      flex-direction: row-reverse;
    }

    [dir="rtl"] .forgot-password-container {
      text-align: right;
    }

    [dir="rtl"] input[type="email"] {
      text-align: right;
    }

    [dir="rtl"] .back-text {
      text-align: right;
    }
  </style>
</head>
<body dir="ltr">

  <div class="container">
    <!-- Header -->
    <div class="header">
      <div class="logo">
        <img src="logo.png" alt="Gov Alert Logo">
        <h1>Gov Alert</h1>
      </div>
      <button class="language-toggle" onclick="toggleLang()">🌐</button>
    </div>

    <!-- Forgot Password Card -->
    <div class="forgot-password-container">
      <div class="step-indicator"> Reset Your Password</div>
      <h2 id="forgotTitle">Forgot Password</h2>

      <form onsubmit="return handleSubmit(event)">
        <input type="email" id="emailField" placeholder="Email address" required>
        <button type="submit" class="submit-btn" id="submitBtn">Submit</button>
      </form>

      <div class="success-message" id="successMessage">
        If an account exists with this email, you will receive instructions shortly.
      </div>
    </div>

    <!-- Back to Login -->
    <p class="back-text">
      <a href="login.html" id="backLink">← Back to Log in</a>
    </p>
  </div>

  <script>
    let isArabic = localStorage.getItem('isArabic') === 'true';

    function toggleLang() {
      isArabic = !isArabic;
      localStorage.setItem('isArabic', isArabic);
      applyLang();
    }

    function applyLang() {
      document.documentElement.dir = isArabic ? "rtl" : "ltr";

      document.getElementById("forgotTitle").textContent = isArabic ? "نسيت كلمة المرور" : "Forgot Password";
      document.getElementById("emailField").placeholder = isArabic ? "عنوان البريد الإلكتروني" : "Email address";
      document.getElementById("submitBtn").textContent = isArabic ? "إرسال" : "Submit";
      document.getElementById("backLink").textContent = isArabic ? "العودة إلى تسجيل الدخول" : "Back to Log in";
    }

    function handleSubmit(event) {
      event.preventDefault();
      const successMessage = document.getElementById("successMessage");
      successMessage.style.display = "block";
      return false;
    }

    // Apply language settings on page load
    applyLang();
  </script>
</body>
</html>
