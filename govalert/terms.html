<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Terms and Conditions - Gov Alert</title>
  <style>
    body {
      background-color: #F2FBFC;
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px;
      text-align: center;
      transition: direction 0.3s;
    }

    .terms-container {
      max-width: 800px;
      margin: 0 auto;
      background: white;
      padding: 40px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    .terms-container h1 {
      color: #333;
      margin-bottom: 20px;
    }

    .terms-container img {
      width: 100%;
      max-width: 600px;
      border-radius: 10px;
      margin-bottom: 20px;
    }

    .terms-container p {
      color: #333;
      font-size: 16px;
      line-height: 1.6;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="terms-container">
    <h1 id="termsTitle">Terms and Conditions</h1>
    <img src="conditions.png" alt="Terms and Conditions">
    <p id="termsContent">
      
    </p>
  </div>

  <script>
    let isArabic = localStorage.getItem('isArabic') === 'true';

    function toggleLang() {
      console.log('toggleLang called, isArabic before toggle:', isArabic);
      isArabic = !isArabic;
      localStorage.setItem('isArabic', isArabic);
      console.log('isArabic after toggle:', isArabic);

      document.body.dir = isArabic ? "rtl" : "ltr";

      document.getElementById("termsTitle").textContent = isArabic ? "الشروط والأحكام" : "Terms and Conditions";
      document.getElementById("termsContent").innerHTML = isArabic
        }

    // Apply language on page load
    console.log('Page loaded, isArabic:', isArabic);
    if (isArabic) toggleLang();
  </script>
</body>
</html>
